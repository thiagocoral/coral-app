apiVersion: apps/v1
kind: Deployment
metadata:
  name: coral-app
  namespace: coral-project-krq9s
spec:
  replicas: 1 # Reduzi para 1 para facilitar o debug
  selector:
    matchLabels:
      app: coral-app
  template:
    metadata:
      labels:
        app: coral-app
    spec:
      containers:
      - name: app-container
        image: docker.io/thicoral/coral-app:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: NAI_ENDPOINT
          value: "https://10.42.163.114/enterpriseai/gateway/v1/chat/completions"
        - name: NAI_API_KEY
          value: ""
        - name: MODEL_NAME
          value: "unified-endpoint"
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: coral-project-krq9s
spec:
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: coral-app
