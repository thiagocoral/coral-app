apiVersion: apps/v1
kind: Deployment
metadata:
  name: coral-app
  namespace: coral-project-krq9s
spec:
  replicas: 1 # Reduzi para 1 para facilitar o debug
  selector:
    matchLabels:
      app: coral-app
  template:
    metadata:
      labels:
        app: coral-app
    spec:
      containers:
      - name: app-container
        image: docker.io/thicoral/coral-app:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3
        env:
        - name: NAI_ENDPOINT
          value: "https://10.42.163.114/enterpriseai/gateway/v1/chat/completions"
        - name: NAI_API_KEY
          value: ""
        - name: MODEL_NAME
          value: "unified-endpoint"
        # Endpoints salvos (opcional): aparecem com ⭐ no seletor do app.
        # A API Key fica só no backend e pode vir de um Secret. Exemplo:
        # - name: NAI_PROFILE_1_NAME
        #   value: "GPU L40S - Llama 3.1 8B"
        # - name: NAI_PROFILE_1_URL
        #   value: "https://<nai>/enterpriseai/gateway/v1/chat/completions"
        # - name: NAI_PROFILE_1_MODEL
        #   value: "llama-31-8b"
        # - name: NAI_PROFILE_1_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: nai-endpoints
        #       key: profile-1-api-key
        #       optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: coral-project-krq9s
spec:
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: coral-app
